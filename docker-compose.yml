version: '3.8'

services:
  cloudpulse-core:
    build: .
    ports:
      - "8000:8000"
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://cloudpulse:pulsepass@postgres:5432/cloudpulse
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=cloudpulse-evidence
      - REGION=ap-south-1
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=cloudpulse
      - POSTGRES_PASSWORD=pulsepass
      - POSTGRES_DB=cloudpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=cloudpulse
      - MINIO_ROOT_PASSWORD=pulsepass
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
